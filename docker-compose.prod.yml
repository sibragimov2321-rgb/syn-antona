services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - phase4i_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  controlled-live:
    build: .
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader}
      SERVICE_ROLE: controlled_live
      SHADOW_EXECUTION_ENABLED: "false"
    command: ["python", "-m", "app.trading.controlled_live_runner"]
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  telegram:
    build: .
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader}
      LIVE_TRADING_ENABLED: "false"
      SHADOW_EXECUTION_ENABLED: "false"
    command: ["python", "-m", "app.telegram.runner"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["telegram"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  phase4i_postgres:
